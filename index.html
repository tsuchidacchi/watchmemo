<h1>WatchMemo</h1>
<p>WatchMemo は、Apple Watch で一定間隔ごとに「何をしていますか？」と入力を促し、入力した内容を iPhone から日ごとの Markdown ファイルに時刻付きで記録する、個人用の行動ログアプリです。</p>
<p>記録先は、利用者が選んだ iCloud ドライブのフォルダと、必要に応じて利用者自身の Google ドライブです。</p>
